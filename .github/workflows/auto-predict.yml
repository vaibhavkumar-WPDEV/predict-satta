name: Auto predict

# A watcher: each run keeps fetching new results every 10 minutes for about
# 5.5 hours, scores the locked predictions, re-learns the model weights and
# locks the next predictions, then starts the next watcher itself (GitHub
# dropped scheduled runs for up to 8 hours). The schedule is only a backup;
# scheduled starts wait in the queue while a watcher runs. Each commit is a public, timestamped
# proof that a prediction existed before its result.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  # also run right away when the engine or this workflow changes
  push:
    paths:
      - "satta/**"
      - ".github/workflows/auto-predict.yml"

permissions:
  contents: write
  actions: write   # lets a finishing watcher start the next one

concurrency:
  group: auto-predict
  # new code (push) or a manual start replaces a running watcher;
  # scheduled starts just queue behind it
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Watch for results (fetch -> check -> learn -> predict -> lock, every 10 min)
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "satta-bot"
          git config user.email "satta-bot@users.noreply.github.com"
          end=$(( $(date +%s) + 330 * 60 ))
          first=1
          while :; do
            python -m satta cycle || echo "cycle failed, retrying next round"
            # upgraded level, separate files (data/pattern/); a failure here never stops engine 4.0
            python -m satta pattern || echo "pattern engine failed, engine 4.0 unaffected"
            git add -A data/
            # commit on a new result, a new locked prediction or a new full
            # re-fetch; the first round after a code push also publishes the
            # recomputed dashboard
            if [ "$first" = 1 ] && [ "$EVENT" = "push" ]; then
              publish=1
            elif git diff --cached --quiet -- data/results.csv data/predictions.jsonl data/sync_state.json data/pattern/predictions.jsonl; then
              publish=0
            else
              publish=1
            fi
            if [ "$publish" = 1 ] && ! git diff --cached --quiet; then
              git commit -q -m "auto: results + locked predictions $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
              git pull -q --rebase origin "$BRANCH" && git push -q || echo "push failed, retrying next round"
            else
              git reset -q
              git checkout -q -- data/
            fi
            first=0
            [ "$(date +%s)" -ge "$end" ] && break
            sleep 600
          done

      - name: Start the next watcher (GitHub often drops scheduled runs)
        if: ${{ !cancelled() }}   # a push cancels a watcher and starts its own
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run auto-predict.yml --ref "${{ github.ref_name }}" || echo "could not chain; the schedule will start one"
